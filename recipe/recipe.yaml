context:
  version: "0.1.8"

package:
  name: nanovector
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nanovector/nanovector-${{ version }}.tar.gz
  sha256: 37495fe17d8efe6cecbb127927a2f757a68a2834d0fded7336936b57aa692acc

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - nanovector
      pip_check: true

about:
  homepage: https://github.com/eminsk/nanovector
  summary: Minimalist, bare-metal SIMD vector search and episodic memory engine
  description: |
    The SQLite of Vector Search and episodic memory for AI agents in ~120KB.
    Pure C99, AVX2+FMA, ARM NEON, and zero external dependencies.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/eminsk/nanovector
  documentation: https://github.com/eminsk/nanovector#readme

extra:
  recipe-maintainers:
    - eminsk
